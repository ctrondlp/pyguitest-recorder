# pyguitest-recorder configuration.
#
# Copy to $XDG_CONFIG_HOME/pyguitest-recorder/config.toml (which is
# ~/.config/pyguitest-recorder/config.toml unless XDG_CONFIG_HOME is set),
# or to ~/.pyguitest-recorder.toml.
#
# Precedence is built-in defaults, then this file, then command-line flags.
# Every key below shows its default; delete what you do not want to change.
# The section headings are grouping for the reader -- a key works under any of
# them, or under none -- and a key that is not a setting is refused by name,
# whichever section it appears in.

[capture]
# display = ":0"          # unset means $DISPLAY
screen = 0
backend = "auto"          # "auto" or "xrecord"
# Both of these are chords: "Escape", "ctrl+Escape", "ctrl+shift+F1". They
# match exactly, so binding ctrl+F1 leaves ctrl+shift+F1 to the application.
stop_key = "Escape"       # key that ends a recording
stop_key_presses = 2      # ...pressed this many times in a row. Two, because
                          # one Escape belongs to the application being
                          # recorded; presses that do not complete a run are
                          # passed through and recorded. Use 1 with a key
                          # nothing else wants, such as Pause.
stop_key_interval = 2.0   # seconds within which those presses must arrive
check_key = "ctrl+1"      # records a check on what is under the pointer;
                          # "" records none and lets the key through. A bare
                          # function key is risky here: many laptops send a
                          # hardware media keysym for it instead of the
                          # literal name (F1 -> XF86_AudioMute, confirmed
                          # live), which the matcher never sees.
announce_checks = true    # print each check to the terminal as it happens
window_context = true     # open a pyguitest session to identify windows
element_context = true    # resolve clicks to AT-SPI elements

[analyzer]
motion_threshold = 8        # pixels; below this a press/release is a click
click_interval = 0.5        # seconds a button may be held and still be a click
double_click_interval = 0.4 # seconds within which clicks merge
text_idle = 1.5             # seconds of silence that end a run of typed text
pause_threshold = 1.0       # seconds of inactivity that become a Pause event
hover_threshold = 0.3       # seconds the pointer must rest somewhere for that
                            # to record as a hover. This is what makes anything
                            # driven by hovering replayable -- a menu category
                            # that opens its submenu when the pointer sits on
                            # it is not a click, and without this the recording
                            # keeps only the click that followed, which then
                            # replays onto whatever is there with no submenu
                            # open. Set to 0 for clicks, drags and keys only.
record_motion = false       # emit *every* pointer motion, not just the rests.
                            # For the route itself -- a drag, a drawing, a
                            # gesture, all of which are *made* of their path --
                            # not for what the pointer reveals: each position
                            # resolves the window it was in and renders a line
                            # of its own, so under "teleport" it is a wall of
                            # moves, while "natural"/"recorded" is what the
                            # shaping is for. A drag's path goes into its own
                            # call as via= either way. Rests are still recorded
                            # as hovers. hover_threshold above is the cheap half
                            # of the same thing, and is what anything driven by
                            # hovering actually needs.

# Synchronization inference: work out what each pause was waiting for, and
# emit that instead of a sleep. A window that opened becomes wait_for_window,
# an element that appeared becomes wait_for_element, and a pause with nothing
# observable behind it becomes wait_for_idle on the window's process.
sync_inference = true
# The idle rule alone needs WINDOW_PID, which not every desktop offers, so it
# can be declined without giving up the other two.
infer_idle = true

[generator]
locators = "element"        # "element", "relative" or "absolute"
motion = "teleport"         # "teleport", "natural", "recorded" or "verbatim":
                            # how a pointer move is rendered. "teleport" is
                            # gui.move_mouse(), exactly as recorded. "natural"
                            # is gui.move_mouse_naturally(): the same call
                            # length and the same recorded endpoints, with a
                            # path pyguitest shapes, so a hover reveal or a hot
                            # corner fires on the approach rather than at the
                            # destination. "recorded" puts the route back as
                            # via= waypoints thinned to the corners it turned
                            # on. "verbatim" is every recorded position, each
                            # with the wait that preceded it -- the only value
                            # that replays the recorded *timing* as well, which
                            # is what a menu row that opens its submenu on a
                            # hover, and pops down once the pointer has left for
                            # long enough, is reacting to. It needs
                            # record_motion for anything to replay, and it turns
                            # a few seconds of motion into a thousand-line
                            # script.
                            # One exception either way: a move that starts or
                            # ends where the pointer came to rest keeps its
                            # recorded route whichever setting is in force. A
                            # route taken from a rest was steered, not travelled
                            # -- a menu opens its submenu on that rest, and the
                            # path out of it has to be the one that was walked,
                            # or a shaped one crosses other rows and opens
                            # theirs. Teleport stays the default because the
                            # move before a click is rendered here too, and a
                            # derived 0.25-1.5s per click adds up. Needs a
                            # pyguitest with that method: without one the
                            # recording still renders, as teleports, and says
                            # so.
max_waypoints = 32          # cap on via points under "recorded"; 0 or less for
                            # no cap. A backstop above what thinning produces,
                            # not a budget: reaching a much smaller number
                            # means dropping corners, and a route made of
                            # corners (a zigzag) then comes out a straight line
comments = true
include_header = true       # the docstring naming versions and desktop
# Your own text to open the file with, above that docstring -- a licence, a
# ticket number, whatever a generated file is expected to carry. The
# "Generated by" line and the version block still follow it.
# header = """
# Copyright (c) ACME. Regenerate with pyguitest-recorder --regenerate.
# """
capability_preamble = true  # emit gui.require(...) naming what the script uses
default_timeout = 10.0
format_output = true        # run ruff format over the generated file
function_name = "main"
# Both below default off: real signal worth seeing at least once, not
# noise to silence by default. Turn on once you already know what they mean.
suppress_keymap_warning = false  # silence uinput's keyboard-layout caveat
suppress_atspi_chatter = false   # silence GLib's unrelated AT-SPI/dbind log noise

[privacy]
sensitive = false           # treat all typed text as secret
redact_sensitive = true     # password-field text becomes an environment lookup
record_raw = false          # keep the raw event stream (includes keystrokes)

[output]
# output = "recorded.py"
# session_file = "recording.json"
debug = false
