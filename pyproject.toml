[build-system]
# license = "..." below is the PEP 639 SPDX-string form, which setuptools only
# understands from 77 onward; an older setuptools either fails or silently
# drops the license metadata. pyguitest pins the same floor for the same
# reason.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyguitest-recorder"
# The version lives in src/pyguitest_recorder/__init__.py and is read from
# there, so the wheel, `--version` and `__version__` cannot disagree.
dynamic = ["version"]
description = "Record desktop GUI activity and generate pyguitest scripts"
readme = "README.md"
requires-python = ">=3.10"
# GPL-2.0-or-later, matching pyguitest. Not only for consistency: the
# recorder imports pyguitest at run time and its whole output is pyguitest
# source, so a permissive license here would be claiming more than it can.
license = "GPL-2.0-or-later"
authors = [{ name = "Dennis K. Paulsen" }]
keywords = ["gui", "testing", "recorder", "automation", "x11", "pyguitest"]

# No `License ::` classifier: with the PEP 639 `license` SPDX string above,
# setuptools>=77 rejects the distribution if both are present. Same reason
# pyguitest's list omits one.
classifiers = [
    # 0.1.0, never tagged, and "record more real applications" is still an
    # open item. Every piece works end to end, but the coverage 4-Beta claims
    # is not one this tree can make yet; pyguitest is 4-Beta because it can.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    # Capture is XRecord, so recording is X11-only. What it writes is
    # pyguitest source, which then runs wherever pyguitest does -- these say
    # where you can record, not where the generated script replays.
    "Environment :: X11 Applications",
    "Operating System :: POSIX :: Linux",
    # The suite and a live recording both pass on FreeBSD 15.
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    # The versions CI actually runs; 3.14 is added here when the matrix adds
    # it, not before.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    # The whole output is Python source.
    "Topic :: Software Development :: Code Generators",
    # No `Typing :: Typed`: the tree is annotated and mypy runs strict over
    # it, but no py.typed marker ships, so PEP 561 has downstream checkers
    # ignore those annotations. The claim follows the marker, not the other
    # way round.
]

# pyguitest is not optional: the recorder's output is pyguitest source, and
# the generator validates what it emits against the installed public API.
dependencies = [
    # Floor is the version the generator's output is verified against, not
    # the oldest that might work: `validate()` checks every emitted call
    # against the installed Session, so an older pyguitest would not fail
    # loudly, it would quietly accept a script naming methods it lacks.
    "pyguitest>=0.6.0",
    # tomllib is 3.11+; 3.10 reads the configuration file through tomli.
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
# XRecord capture. python-xlib speaks the wire protocol in pure Python, which
# is the same reason pyguitest's X11 backend uses it.
x11 = ["python-xlib>=0.33"]
# Element resolution at record time; the reason a recording can name a widget
# instead of a coordinate.
atspi = ["pyguitest[atspi]>=0.5.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
homepage = "https://github.com/ctrondlp/pyguitest-recorder"
repository = "https://github.com/ctrondlp/pyguitest-recorder"
issues = "https://github.com/ctrondlp/pyguitest-recorder/issues"

[project.scripts]
pyguitest-recorder = "pyguitest_recorder.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pyguitest_recorder.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "D",        # pydocstyle
    "B",        # bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # simplification
    "RET",      # return consistency
    "ARG",      # unused arguments
    "C901",     # cyclomatic complexity
]
ignore = [
    "D203",    # incompatible with D211; keep no blank line before class docstring
    "D213",    # incompatible with D212; keep the summary on the first line
    "D401",    # properties read better as noun phrases than imperatives
    "D105",    # __enter__/__exit__ and friends document themselves
]

[tool.ruff.lint.mccabe]
# A ceiling on what gets added, not a claim the tree is already under it.
# pyguitest sets 15; this is lower because this tree can afford it. 11 clears
# everything, and the only function anywhere near it is the live check's
# `send_input` (11), whose count is nested closures rather than branching --
# hoisting those to module level would cost readability to please the lint.
# Nothing under src/ or tests/ exceeds 8. Ratchet down as that stays true.
max-complexity = 11

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# The capture interface exists to be overridden: its stubs necessarily accept
# arguments they do not use.
"src/pyguitest_recorder/backends/base.py" = ["ARG002"]
"src/pyguitest_recorder/backends/*.py" = ["ARG002", "ARG005"]
# The generator dispatches on event type through one uniform handler
# signature; handlers for events with no fields ignore the event.
"src/pyguitest_recorder/generator/python.py" = ["ARG002"]
"tests/*" = [
    "ARG001", "ARG002", "ARG003", "ARG005",
    "B018",
    "D100", "D101", "D102", "D103", "D104", "D107",
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
# strict already implies pyguitest's warn_unused_configs, warn_redundant_casts
# and check_untyped_defs, so this stays the stricter of the two settings.
strict = true
# mypy defaults this to true and imports sqlite3 unconditionally to honor it --
# a crash, not a fallback, on a Python built without it. Confirmed against
# pyguitest on FreeBSD 15, whose python3.11 port has no _sqlite3; harmless
# where the module is present, since the cache becomes one file per module.
sqlite_cache = false

[[tool.mypy.overrides]]
# python-xlib, pyguitest and PyGObject ship no stubs; gi is only reachable
# through the optional element resolver.
module = ["Xlib.*", "pyguitest.*", "gi.*", "gi.repository.*", "tomli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
