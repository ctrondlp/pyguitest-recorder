# Two kinds of job, and the second is the one that matters.
#
# `tests` runs the suite, which needs no display: every path this package
# drives is probed at runtime and stands in as a fake under test, including
# the XRecord decoder, which is fed synthetic `Xlib.protocol.event` structs.
#
# `live` records a real application on a real X server. That distinction is
# not academic here. The first time it ran it found that the RECORD context
# was created on one display connection and enabled on the other -- which the
# server refuses, so capture had never worked at all, with a green suite and a
# clean type check. The second time it found window context coming from the
# compositor rather than the recorded display. Neither is reachable from a
# unit test, which is why this job exists rather than being left to whoever
# happens to run the script by hand.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Nightly, for the two pyguitest-axis jobs below: a break against the
  # declared floor or against upstream git main is made upstream, so no
  # push *here* is guaranteed to surface it before pyguitest releases it --
  # the exact "red run the morning after" those jobs exist to pre-empt.
  # Every other job skips on schedule: they test this repository's own
  # code, which did not change overnight.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    # Skipped on the nightly schedule, like every job below that tests this
    # repository's own code: nothing here changed overnight, only the
    # pyguitest axis the two dedicated jobs re-check.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # pyguitest is a hard dependency: the generator asks the installed
      # Session which methods exist before it will emit a call to one, and
      # `validate()` checks the finished file against it. Without it those
      # checks pass vacuously, which is worse than failing.
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[x11,dev]'

      - name: Run the test suite
        run: python -m pytest -q

  # Every other job installs whatever pyguitest PyPI resolves today, so all
  # of them together test exactly one point of the compatibility range this
  # package claims: its newest edge. The floor in pyproject.toml -- the
  # version the generator's output is verified against, per the comment on
  # `dependencies` -- was a promise nothing executed, and pyguitest's main
  # branch is the release the next bump will resolve to, so a break there
  # surfaces here before it ships rather than as a red run the morning after.
  # Versions *below* the floor are deliberately not tested: the floor exists
  # to refuse them, and `validate()` against an older Session would pass
  # vacuously -- the exact failure mode the floor was raised to close.
  #
  # Two jobs rather than one two-leg matrix, on purpose: `publish` must
  # gate on the floor leg -- shipping a release whose declared floor
  # demonstrably fails is the regression this exists to close -- while
  # staying ungated on the main leg, whose red can be upstream churn no
  # release here should wait out. `needs:` can name a job, not a matrix
  # cell, so the legs have to be jobs.
  pyguitest-floor:
    name: pyguitest floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # One version: this job is about the pyguitest axis, and
          # Python-to-Python differences are the `tests` matrix's business.
          python-version: "3.13"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[x11,dev]'

      # Read back out of pyproject.toml rather than repeated here, so raising
      # the floor cannot leave this job testing the old one. Matched by
      # requirement *name*, not a string prefix, so a future pyguitest-\*
      # dependency cannot be mistaken for pyguitest itself.
      - name: Downgrade pyguitest to the declared floor
        run: |
          set -eu
          floor=$(python -c "
          import re, tomllib
          from packaging.requirements import Requirement
          with open('pyproject.toml', 'rb') as f:
              deps = tomllib.load(f)['project']['dependencies']
          spec = next(d for d in deps if Requirement(d).name == 'pyguitest')
          print(re.search(r'>=\s*([0-9][0-9a-z.]*)', spec).group(1))
          ")
          pip install "pyguitest==$floor"

      # In the log so a red run names its combination without re-running;
      # pip freeze prints the resolved version (or a git URL with its sha).
      - name: Show the combination under test
        run: pip freeze | grep -i pyguitest

      # One run, two verdicts: the suite's own exit code (through pipefail),
      # and a refusal of capability-gated skips. conftest skips
      # version-gated assertions when the installed pyguitest lacks the
      # capability -- exactly what a floor install is positioned to trigger
      # -- and a floor leg that quietly skipped them would claim the suite
      # passed "against the declared floor" while testing less of it. Same
      # pattern as the windows job's ruff guard below.
      - name: Run the test suite, refusing capability-gated skips
        run: |
          set -eo pipefail
          python -m pytest -q -rs 2>&1 | tee floor-run.txt
          if grep -q "install a newer pyguitest" floor-run.txt; then
            echo "::error::capability-gated tests were skipped against the declared floor"
            exit 1
          fi

  pyguitest-main:
    name: pyguitest main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[x11,dev]'

      - name: Install pyguitest from git main
        run: pip install --force-reinstall "pyguitest @ git+https://github.com/ctrondlp/pyguitest"

      # pip freeze names the resolved git sha, which the version string
      # cannot: upstream bumps __version__ at release commits, so git main
      # usually *reports* the latest release's number while being newer.
      - name: Show the combination under test
        run: pip freeze | grep -i pyguitest

      - name: Run the test suite
        run: python -m pytest -q

  lint:
    name: lint and types
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e '.[x11,dev]'
      # Pinned over the top of `dev`'s `ruff>=0.6`/`mypy>=1.11`, which resolve
      # to whatever shipped that morning. ruff ships a minor roughly every
      # other week and mypy is past 2.x, so a newly default-on rule or a
      # tightened inference turns `main` red on a commit that changed nothing
      # -- and the fix ("pin it") then lands under time pressure, which is the
      # worst moment to decide whether a newly-flagged pattern is worth
      # fixing. The lower bounds stay in `dev` for contributors; the gate
      # takes exact versions. `lint-next` watches the newest ones, where drift
      # is news rather than a blocked merge; bump these when it reports clean.
      - run: pip install 'ruff==0.16.5' 'mypy==2.3.1'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  lint-next:
    # The same checks against the newest ruff and mypy, allowed to fail. This
    # is how a linter release becomes a thing to look at on purpose instead of
    # a red `main` nobody asked for, and it deliberately gates nothing:
    # `publish` does not list it in `needs`. Runs on the schedule too, since a
    # drift probe is most useful when nobody pushed.
    name: lint and types (newest, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e '.[x11,dev]'
      - run: pip install --upgrade ruff mypy
      # Reported so a failure below can be read against a version without
      # digging through the install log.
      - run: |
          ruff --version
          mypy --version
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  live:
    name: live capture on a real X server
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Xvfb is the X server; zenity is something to record; the at-spi
      # packages are what let a widget be named rather than pointed at; and
      # PyGObject is for the second window, without which the check cannot
      # cover moving between two windows -- a bare server has no window
      # manager, so two dialogs land exactly on top of each other and
      # "which window is under this point" stops being answerable. A runner
      # has no session bus, so the check starts its own -- see
      # `reexec_on_a_private_bus` -- and borrowing one would be wrong anyway.
      - name: Install an X server and an application to record
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb zenity dbus-x11 at-spi2-core libatk-adaptor \
            python3-gi gir1.2-gtk-3.0

      - run: pip install -e '.[x11,dev]'

      - name: Record a real application and check what came out
        run: ./scripts/live-capture-check.py

  windows:
    name: the suite on Windows
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    # The win32 capture backend lands here before there is a Windows machine
    # in anyone's loop, so this job is what stops a Linux-only assumption
    # reaching a user first. It has already earned its place twice: a
    # `Path.home()` test that only held where HOME decides the home directory,
    # and thirty-three rendering assertions that silently required `ruff` on
    # PATH. Neither is visible on the ubuntu runners.
    #
    # Nothing here can install a low-level input hook -- a CI runner has no
    # interactive desktop -- so what this proves is what the fakes prove, on
    # the platform they describe: every module imports, the suite collects,
    # and the tests written to run anywhere pass.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # One version: this job is about the platform, and Python-to-Python
          # differences are the `tests` matrix's business.
          python-version: "3.12"

      # `x11` is deliberately absent: python-xlib is a Linux dependency and
      # the win32 backend needs nothing installed. `dev` brings ruff, which
      # the generator shells out to -- without it the rendering assertions
      # skip rather than fail, and a skip here would hide what this job is
      # for.
      #
      # pyguitest resolves from PyPI here like every other job's, because the
      # floor in pyproject.toml is the release the generator's output was last
      # validated against. Deliberately not named here: this comment has now
      # drifted behind the real floor three times, and the floor itself is the
      # only copy worth reading -- `pyguitest-floor` installs exactly it, and
      # `test_generator.py` asserts PROFILE matches whatever is installed, so
      # the pair cannot disagree without reddening a job. Historically the
      # floor has held the platform: 0.11.0 for `pyguitest.backends.win32`
      # (before which this job installed pyguitest from git, since no
      # published version imported here at all), 0.12.0 for the
      # `Element.expand()`/`.collapse()` and direct `.selectable` read the
      # generator emits, 0.14.0 for the `macos` backend the macOS capture
      # backend resolves windows and elements through.
      #
      # So this repository does not build at all until the declared floor is
      # on PyPI, and not only here: every job installs this package, so
      # `tests`, `lint` and `live` fail at their own install steps for the
      # same reason. That is the honest outcome of a floor raised ahead of its
      # release, and it clears the moment the release lands -- but a red run
      # here before then is the ordering, not a regression in this repository.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # Proves the floor really delivers the platform: without this, a
      # pyguitest that silently lacked the module would send every win32
      # test into the skip path and the job would pass having tested none of
      # what it exists for.
      - name: Check the installed pyguitest carries the win32 backend
        run: python -c "import pyguitest.backends.win32"



      - name: Run the test suite
        run: python -m pytest -q

      - name: Check the formatter-dependent tests actually ran
        shell: bash
        # A skip for *want of ruff* is the correct answer without it and the
        # wrong one here: `dev` installs it, so that skip would mean the
        # marker is firing when it should not and thirty-three assertions had
        # quietly stopped running on the one platform this job exists for.
        #
        # Matched on the conftest's own reason rather than on the word
        # "skipped", which the summary line carries whenever *any* selected
        # test skips for *any* reason -- the first version of this check
        # failed the job over one unrelated platform skip while all
        # thirty-three had in fact run. `-rs` prints every skip reason, so
        # the log says which and why without anyone re-running it. The
        # pattern below must track the reason string in tests/conftest.py's
        # `pytest_collection_modifyitems` -- it changed once already, when
        # the gate learned to find ruff as an importable module and not only
        # as a PATH binary, and a stale pattern here makes this guard
        # silently dead rather than red.
        run: |
          set -eo pipefail
          python -m pytest -q -m needs_ruff -rs 2>&1 | tee marked.txt
          if grep -q "ruff is unavailable" marked.txt; then
            echo "::error::ruff-dependent tests skipped despite the dev extra"
            exit 1
          fi

  macos:
    name: the suite on macOS, where Darwin is the host rather than a mock
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    # `backends/macos.py` ships, `pyproject.toml` declares the `macos` extra
    # and both MacOS X classifiers, and docs/developers/status.md records
    # three live runs on a granted macOS 26.7 Mac -- but until this job
    # nothing in CI ran on Darwin at all, while `windows` had existed on
    # precisely the same reasoning. The gap was the one cross-platform claim
    # this repository made and never checked.
    #
    # `tests/test_macos.py` says of itself that it is "driven from a machine
    # that is not a Mac", and drives everything against a stand-in `Quartz`
    # parked in `sys.modules`. That suite is thorough -- translation,
    # keycodes, modifier flags, teardown, and a cross-repository check of
    # `_KEYCODES` against `pyguitest.backends.macquartz` -- and there is
    # exactly one thing it cannot see: whether the names it fakes are the
    # names PyObjC really exports. A transcription error in the binding is
    # the likeliest way this code is wrong, and a fake never sees it.
    #
    # Nothing here can install an event tap: a runner has no interactive
    # window server and no TCC grant. So what this proves is what `windows`
    # proves on its platform -- every module imports, the suite collects, the
    # tests written to run anywhere pass -- plus the probe below, which is the
    # part only a Mac can answer. Advisory for now (`continue-on-error`), the
    # route `windows` and pyguitest's own `macos` job both took: it is
    # promoted to a gate, and added to `publish`'s `needs`, once it has been
    # watched passing rather than on the commit that introduces it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # One version: this job is about the platform, and Python-to-Python
          # differences are the `tests` matrix's business.
          python-version: "3.12"

      # `macos` brings `pyguitest[macos]`, i.e. the two PyObjC frameworks the
      # backend resolves the tap and the keycodes through. `dev` brings ruff,
      # which the generator shells out to -- without it the rendering
      # assertions skip rather than fail, and a skip here would hide what
      # this job is for. `x11` is absent for the same reason it is absent
      # from `windows`: python-xlib is a Linux dependency.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[macos,dev]'

      # The counterpart of `windows`' win32 check, and for the same reason:
      # without it a pyguitest that silently lacked the module would send
      # every macOS test into the skip path and this job would pass having
      # tested none of what it exists for.
      - name: Check the installed pyguitest carries the macOS backends
        run: |
          python -c "import pyguitest.backends.macos"
          python -c "import pyguitest.backends.macquartz"

      - name: Run the test suite
        run: python -m pytest -q

      # The one step no other runner can run. Every assertion is about what
      # this package derives from a real Darwin host, not about what that
      # host answers -- the runner's grants are GitHub's business and change
      # without notice, so requiring a particular verdict would pin their
      # image into the suite.
      #
      # The entry points are checked by name against the real module rather
      # than by reading `unavailable_reason()`'s prose. The first version of
      # this step matched substrings in that sentence ("CGEvent",
      # "CFMachPort") and was wrong: run on a real Mac (macOS 26.7, 2026-11-02)
      # it covered 23 of the 34 names in `_QUARTZ_NEEDED` and would have let a
      # missing `CFRunLoopRun`, `kCGHIDEventTap`, `kCGKeyboardEventKeycode` or
      # `kCGScrollWheelEventDeltaAxis*` print "the binding resolved" and exit
      # 0. A false pass in the one check the job exists for. `hasattr` over
      # the list itself cannot drift from it, and reports every missing name
      # at once instead of whichever the reason happened to mention.
      - name: Check what the backend makes of a real Mac
        run: |
          python - <<'PY'
          import sys

          import Quartz

          from pyguitest_recorder.backends import macos

          assert sys.platform == "darwin", sys.platform

          # The transcription error this job exists to catch: a name this code
          # reaches for that PyObjC does not export. A fake Quartz in
          # sys.modules has every name the tests give it, so this is invisible
          # to the suite above by construction.
          needed = macos._QUARTZ_NEEDED
          missing = [name for name in needed if not hasattr(Quartz, name)]
          print(f"_QUARTZ_NEEDED: {len(needed) - len(missing)}/{len(needed)} resolve")
          if missing:
              sys.exit(f"the real Quartz lacks: {', '.join(missing)}")

          # Then the verdict, reported rather than required -- except for the
          # one reason that cannot be true here, since the step above installed
          # the extra.
          reason = macos.unavailable_reason()
          print(f"unavailable_reason() -> {reason!r}")
          print(f"available()          -> {macos.available()}")
          if reason is not None and "pyguitest[macos]" in reason:
              sys.exit(f"the macos extra is installed, yet: {reason}")
          print(
              "the binding resolved"
              if reason is None
              else "the binding resolved; the remaining reason is the TCC grant"
          )
          PY

      - name: Check the formatter-dependent tests actually ran
        # Same guard as `windows`, same reason: `dev` installs ruff, so a skip
        # for want of it here would mean the marker is firing when it should
        # not and the rendering assertions had quietly stopped running.
        run: |
          set -eo pipefail
          python -m pytest -q -m needs_ruff -rs 2>&1 | tee marked.txt
          if grep -q "ruff is unavailable" marked.txt; then
            echo "::error::ruff-dependent tests skipped despite the dev extra"
            exit 1
          fi

  build:
    name: build sdist and wheel
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install build twine
      - run: python -m build

      # A PyPI version number can never be reused, so a tag disagreeing with
      # the packaged version has to fail here rather than ship. Read back out
      # of the built artifact, not out of the source, so it checks what would
      # actually be uploaded. Skipped on branch pushes, where there is no tag.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's|.*/pyguitest_recorder-(.+)\.tar\.gz|\1|')
          echo "tag=$tag packaged=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the packaged"
            echo "::error::version $built -- fix __version__ in"
            echo "::error::src/pyguitest_recorder/__init__.py or retag."
            exit 1
          fi

      # Catches a README that renders on GitHub but not on PyPI, which is
      # otherwise only discovered once the upload is already permanent.
      - run: python -m twine check --strict dist/*

      # Handed to the publish job below rather than rebuilt there, so what
      # reaches PyPI is byte-for-byte what twine just checked.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Publishes to PyPI on a v* tag via Trusted Publishing (OIDC): PyPI is
  # configured to trust this repo/workflow/environment, so there is no API
  # token in secrets to leak or rotate. `id-token: write` is what lets the
  # runner mint the short-lived credential; the action does the rest.
  #
  # Requires one-time setup on pypi.org first -- see "Releasing" in
  # CONTRIBUTING.md. Until that exists, a tag push fails here rather than
  # silently publishing nothing.
  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    # pyguitest-floor is release-gating on purpose: a version can never be
    # re-uploaded, so a release whose declared floor demonstrably fails must
    # not ship. pyguitest-main is deliberately absent -- its red can be
    # upstream churn that no release here should have to wait out.
    needs: [tests, lint, live, build, pyguitest-floor]
    runs-on: ubuntu-latest
    # Must match the environment named in the PyPI publisher config. A
    # required reviewer on it makes each publish a deliberate approval
    # rather than a side effect of pushing a tag.
    environment:
      name: pypi
      url: https://pypi.org/p/pyguitest-recorder
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
