# Two kinds of job, and the second is the one that matters.
#
# `tests` runs the suite, which needs no display: every path this package
# drives is probed at runtime and stands in as a fake under test, including
# the XRecord decoder, which is fed synthetic `Xlib.protocol.event` structs.
#
# `live` records a real application on a real X server. That distinction is
# not academic here. The first time it ran it found that the RECORD context
# was created on one display connection and enabled on the other -- which the
# server refuses, so capture had never worked at all, with a green suite and a
# clean type check. The second time it found window context coming from the
# compositor rather than the recorded display. Neither is reachable from a
# unit test, which is why this job exists rather than being left to whoever
# happens to run the script by hand.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # pyguitest is a hard dependency: the generator asks the installed
      # Session which methods exist before it will emit a call to one, and
      # `validate()` checks the finished file against it. Without it those
      # checks pass vacuously, which is worse than failing.
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[x11,dev]'

      - name: Run the test suite
        run: python -m pytest -q

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e '.[x11,dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  live:
    name: live capture on a real X server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Xvfb is the X server; zenity is something to record; the at-spi
      # packages are what let a widget be named rather than pointed at; and
      # PyGObject is for the second window, without which the check cannot
      # cover moving between two windows -- a bare server has no window
      # manager, so two dialogs land exactly on top of each other and
      # "which window is under this point" stops being answerable. A runner
      # has no session bus, so the check starts its own -- see
      # `reexec_on_a_private_bus` -- and borrowing one would be wrong anyway.
      - name: Install an X server and an application to record
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb zenity dbus-x11 at-spi2-core libatk-adaptor \
            python3-gi gir1.2-gtk-3.0

      - run: pip install -e '.[x11,dev]'

      - name: Record a real application and check what came out
        run: ./scripts/live-capture-check.py

  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install build twine
      - run: python -m build

      # A PyPI version number can never be reused, so a tag disagreeing with
      # the packaged version has to fail here rather than ship. Read back out
      # of the built artifact, not out of the source, so it checks what would
      # actually be uploaded. Skipped on branch pushes, where there is no tag.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's|.*/pyguitest_recorder-(.+)\.tar\.gz|\1|')
          echo "tag=$tag packaged=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the packaged"
            echo "::error::version $built -- fix __version__ in"
            echo "::error::src/pyguitest_recorder/__init__.py or retag."
            exit 1
          fi

      # Catches a README that renders on GitHub but not on PyPI, which is
      # otherwise only discovered once the upload is already permanent.
      - run: python -m twine check --strict dist/*

      # Handed to the publish job below rather than rebuilt there, so what
      # reaches PyPI is byte-for-byte what twine just checked.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Publishes to PyPI on a v* tag via Trusted Publishing (OIDC): PyPI is
  # configured to trust this repo/workflow/environment, so there is no API
  # token in secrets to leak or rotate. `id-token: write` is what lets the
  # runner mint the short-lived credential; the action does the rest.
  #
  # Requires one-time setup on pypi.org first -- see "Releasing" in
  # CONTRIBUTING.md. Until that exists, a tag push fails here rather than
  # silently publishing nothing.
  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, lint, live, build]
    runs-on: ubuntu-latest
    # Must match the environment named in the PyPI publisher config. A
    # required reviewer on it makes each publish a deliberate approval
    # rather than a side effect of pushing a tag.
    environment:
      name: pypi
      url: https://pypi.org/p/pyguitest-recorder
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
